id: fso_turbulence_fso_fading_channel
label: FSO Fading Channel
category: '[FSO Turbulence]'

templates:
  imports: from gnuradio import fso_turbulence
  make: |-
    fso_turbulence.fso_fading_channel(
        C2n=${C2n},
        wavelength=${wavelength},
        distance=${distance},
        coherence_samples=${coherence_samples},
        seed=${seed},
        tau_large=${tau_large},
        tau_small=${tau_small},
        sample_rate=${sample_rate})

parameters:
- id: C2n
  label: 'C2n [m^(-2/3)]'
  dtype: real
  default: 1e-15
- id: wavelength
  label: 'Wavelength [m]'
  dtype: real
  default: 1550e-9
- id: distance
  label: 'Distance [m]'
  dtype: real
  default: 1000.0
- id: coherence_samples
  label: Coherence Samples
  dtype: int
  default: 1000
- id: seed
  label: Seed
  dtype: raw
  default: None
- id: tau_large
  label: 'Tau Large-Scale [s]'
  dtype: real
  default: '0.0'
- id: tau_small
  label: 'Tau Small-Scale [s]'
  dtype: real
  default: '0.0'
- id: sample_rate
  label: 'Sample Rate [Hz]'
  dtype: real
  default: samp_rate

inputs:
- label: in
  domain: stream
  dtype: complex

outputs:
- label: out
  domain: stream
  dtype: complex

documentation: |-
  Gamma-Gamma atmospheric fading channel for Free-Space Optical links.

  Multiplies the complex field amplitude by sqrt(I), where I is Gamma-Gamma
  distributed irradiance with E[I] = 1, so signal power follows the
  irradiance statistics (Andrews & Phillips, 2005). Shape parameters alpha
  and beta are derived from the Rytov variance
  (sigma^2_R = 1.23 C2n k^(7/6) L^(11/6)) via plane-wave approximations.

  Each fading coefficient is held for 'Coherence Samples' consecutive
  samples to model the turbulence coherence time (turbulence ~kHz vs.
  sample rates ~MHz). Set it to sample_rate x coherence_time.

  Non-zero Tau Large-Scale / Tau Small-Scale correlate successive
  coefficients via a Gaussian copula AR(1) per Gamma component,
  preserving the exact Gamma-Gamma marginal. One AR(1) step happens
  per coherence window, so rho = exp(-dt/tau) with
  dt = coherence_samples / sample_rate. Tau = 0 (default) draws that
  component i.i.d. per window, the pre-Phase-6 behaviour. Physically
  tau_large > tau_small (large refractive eddies evolve more slowly).

  C2n regimes: 1e-17 (weak), 1e-15 (moderate), 1e-13 (strong).

file_format: 1
