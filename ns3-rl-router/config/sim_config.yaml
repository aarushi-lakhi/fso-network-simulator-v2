# FSO RL environment configuration. Flat keys; read by the Python side
# (check_env.py, agent/) and mapped onto fso-rl-env command-line arguments.

# topology: pentagon (shared-link routes) or disjoint (link-disjoint routes;
# direct 0-3 link of disjoint_direct_m plus three 2-hop relays with hops of
# disjoint_relay_m — see sim/README.md for the geometry)
topology: pentagon
num_nodes: 5
num_links: 7
mesh_radius_m: 800.0
disjoint_direct_m: 1500.0
disjoint_relay_m: 900.0
data_rate: 100Mbps
channel_delay_us: 5

# link budget
tx_power_dbm: 10.0
noise_dbm: -8.0
wavelength_m: 1550e-9
extinction_coeff_per_m: 1e-5
packet_size_bytes: 1024

# turbulence (C2n in m^-2/3); c2n is the active value
c2n: 1e-15
c2n_weak: 1e-17
c2n_moderate: 1e-15
c2n_strong: 1e-13

# episode
episode_steps: 100
step_time_s: 0.1
update_interval_ms: 1.0

# fading temporal correlation (ns-3 Time strings; 0ms = i.i.d. block fading)
coherence_large: 0ms
coherence_small: 0ms

# traffic (udp or tcp; tcp swaps the reward's drops term for a
# goodput-shortfall term weighted by reward_goodput_weight)
traffic_protocol: udp
traffic_rate: 2Mbps

# observation (route_in_obs appends a one-hot of the current route,
# obs 28 -> 32; false keeps phases 5-9 reproducible)
route_in_obs: false

# reward weights
reward_drop_weight: 1.0
reward_delay_weight: 0.1
reward_flap_penalty: 5.0
reward_energy_weight: 0.01
reward_goodput_weight: 1.0

# rng
sim_seed: 1
