name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            prototype/requirements.txt
            ns3-rl-router/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheels — the CUDA bundle is ~2 GB and useless on CI runners
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "$(grep '^torch==' ns3-rl-router/requirements.txt)"
          pip install -r prototype/requirements.txt -r ns3-rl-router/requirements.txt ruff
      # Two invocations: prototype/tests and agent/tests are both packages
      # named "tests", which collide in a single pytest collection.
      - name: Prototype tests
        run: pytest prototype/tests -q
      - name: Agent and benchmark tests
        run: pytest ns3-rl-router/agent/tests benchmarks/tests -q
      - name: Lint
        run: ruff check prototype benchmarks ns3-rl-router
